[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cropcompass-backend"
version = "0.1.0"
description = "CropCompass API and science engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "openai>=2.0,<3",
  "numpy>=2.0",
  "pandas>=2.2",
  "zstandard>=0.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*", "engine*"]

[tool.setuptools.package-data]
engine = ["crops/*.yaml"]
app = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
