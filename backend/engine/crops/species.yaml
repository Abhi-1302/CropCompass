# Global species sheet: crop physiology shared by every region pack (docs/PLAN.md section 8.1).
#
# stages      Share of the season in the FAO-56 initial / development / mid-season / late stages
#             (FAO-56 Table 11; the row used is noted on each crop).
# kc          Crop coefficients Kc ini / mid / end for a sub-humid climate (FAO-56 Table 12).
# root_m      Maximum effective rooting depth, m (FAO-56 Table 22, upper half of the range for rain-fed use).
# p           Fraction of available water used before stress at ETc ~5 mm/day (FAO-56 Table 22).
# ky          Seasonal yield response to water deficit (FAO-33, as summarised in FAO-56 Table 24).
# heat_c      Day temperature at flowering above which seed or fruit set falls (Luo 2011, Climatic Change
#             109:583-598; Hatfield & Prueger 2015, Weather and Climate Extremes 10:4-10).
# hi, dm      Harvest index (dry matter) and dry-matter share of the harvested product.
# residue_cn  Carbon-to-nitrogen ratio of the crop residue.
# n_fixed     Nitrogen fixed by a legume at attainable yield, kg N/ha; n_credit: nitrogen left for the next crop.
#
# hi, dm, residue_cn and the nitrogen values are typical literature values (indicative). Fields listed in
# `estimated` are not in the FAO tables and were set by analogy with a similar crop: they need agronomist review.
version: 1

