economics:
  currency: INR
  n_price_per_kg: 13  # urea at the subsidised Rs 266.50 per 45 kg bag, 46% N
  validated: false  # prices and costs are indicative until reviewed with local data
  # Where each default price comes from (shown next to every figure); other crops use indicative farm-gate
  # prices, and every cost is an indicative paid-out cost.
  price_sources:
    msp_kharif: [rice, maize, sorghum, pearl_millet, finger_millet, pigeonpea, green_gram, black_gram, soybean,
                 groundnut, sunflower, sesame, cotton]
    msp_rabi: [wheat, chickpea, lentil, mustard]

simulation:
  turnaround_days: 10  # land preparation between one harvest and the next sowing
  sowing_rain_mm: 20  # rain in 3 days that allows rain-fed sowing (the onset rule's threshold)
  sowing_soil_fraction: 0.5  # ...or stored soil water at least this share of capacity (sowing on residual moisture)
  protective_irrigations: 2
  baseline_practice: [{crop: maize, season: kharif, residue: removed}]  # assumed when the journal is empty
