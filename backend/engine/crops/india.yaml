# India crop pack v1: identity, family and shared pest/disease groups used by the season journal and the
# rotation rules, plus the regional agronomy used by the crop models (crop physiology is in species.yaml).
# Durations are typical sowing-to-harvest (or transplanting-to-harvest) ranges in days.
version: 1
region: IN

seasons:
  kharif: {name: Kharif (monsoon), sowing_months: [6, 7, 8, 9]}
  rabi: {name: Rabi (post-monsoon), sowing_months: [10, 11, 12, 1]}
  summer: {name: Summer (zaid), sowing_months: [2, 3, 4, 5]}
  other: {name: Other / perennial, sowing_months: []}

families:
  Poaceae: {name: Cereals & millets, nutrient_role: heavy feeder, gap_years: 1}
  Fabaceae: {name: Legumes, nutrient_role: nitrogen fixer, gap_years: 2}
  Malvaceae: {name: Mallows, nutrient_role: heavy feeder, gap_years: 1}
  Asteraceae: {name: Composites, nutrient_role: moderate feeder, gap_years: 2}
  Solanaceae: {name: Nightshades, nutrient_role: heavy feeder, gap_years: 3}
  Brassicaceae: {name: Brassicas, nutrient_role: heavy feeder, gap_years: 2}
  Amaryllidaceae: {name: Alliums, nutrient_role: light feeder, gap_years: 2}
  Cucurbitaceae: {name: Cucurbits, nutrient_role: moderate feeder, gap_years: 2}
  Pedaliaceae: {name: Sesame, nutrient_role: light feeder, gap_years: 1}
  Euphorbiaceae: {name: Castor, nutrient_role: moderate feeder, gap_years: 1}

host_groups:
  pod_borer: Pod borer / bollworm (Helicoverpa)
  whitefly_viruses: Whitefly-borne leaf curl and mosaic viruses
  root_knot_nematode: Root-knot nematodes
  dry_root_rot: Dry root rot / charcoal rot (Macrophomina)
  collar_rot: Collar and stem rot (Sclerotium rolfsii)
  bacterial_wilt: Bacterial wilt (Ralstonia)
  fall_armyworm: Fall armyworm
  stem_borer: Stem borers
  pink_bollworm: Pink bollworm
  thrips: Thrips
  diamondback_moth: Diamondback moth
  fruit_fly: Fruit fly
  striga: Striga (witchweed)

crops:
  - {id: rice, name: Rice (paddy), family: Poaceae, group: cereal, seasons: [kharif, rabi], duration_days: [100, 150], host_groups: [stem_borer]}
  - {id: wheat, name: Wheat, family: Poaceae, group: cereal, seasons: [rabi], duration_days: [110, 140], host_groups: []}
  - {id: maize, name: Maize, family: Poaceae, group: cereal, seasons: [kharif, rabi], duration_days: [90, 120], host_groups: [fall_armyworm, stem_borer, pod_borer]}
  - {id: sorghum, name: Sorghum (jowar), family: Poaceae, group: cereal, seasons: [kharif, rabi], duration_days: [100, 120], host_groups: [fall_armyworm, stem_borer, dry_root_rot, striga]}
  - {id: pearl_millet, name: Pearl millet (bajra), family: Poaceae, group: cereal, seasons: [kharif, summer], duration_days: [75, 95], host_groups: [stem_borer, striga]}
  - {id: finger_millet, name: Finger millet (ragi), family: Poaceae, group: cereal, seasons: [kharif, rabi], duration_days: [100, 120], host_groups: []}
  - {id: pigeonpea, name: Pigeonpea (red gram), family: Fabaceae, group: pulse, seasons: [kharif], duration_days: [150, 200], host_groups: [pod_borer, root_knot_nematode]}
  - {id: chickpea, name: Chickpea (Bengal gram), family: Fabaceae, group: pulse, seasons: [rabi], duration_days: [90, 120], host_groups: [pod_borer, dry_root_rot, collar_rot, root_knot_nematode]}
  - {id: green_gram, name: Green gram (moong), family: Fabaceae, group: pulse, seasons: [kharif, rabi, summer], duration_days: [60, 75], host_groups: [whitefly_viruses, dry_root_rot]}
  - {id: black_gram, name: Black gram (urad), family: Fabaceae, group: pulse, seasons: [kharif, rabi, summer], duration_days: [70, 90], host_groups: [whitefly_viruses, dry_root_rot]}
  - {id: lentil, name: Lentil (masoor), family: Fabaceae, group: pulse, seasons: [rabi], duration_days: [100, 130], host_groups: [collar_rot]}
  - {id: soybean, name: Soybean, family: Fabaceae, group: oilseed, seasons: [kharif], duration_days: [90, 110], host_groups: [dry_root_rot, collar_rot, whitefly_viruses]}
  - {id: groundnut, name: Groundnut, family: Fabaceae, group: oilseed, seasons: [kharif, rabi, summer], duration_days: [100, 130], host_groups: [collar_rot, root_knot_nematode]}
  - {id: mustard, name: Mustard, family: Brassicaceae, group: oilseed, seasons: [rabi], duration_days: [100, 140], host_groups: []}
  - {id: sunflower, name: Sunflower, family: Asteraceae, group: oilseed, seasons: [kharif, rabi], duration_days: [90, 110], host_groups: [pod_borer, dry_root_rot]}
  - {id: sesame, name: Sesame (til), family: Pedaliaceae, group: oilseed, seasons: [kharif, summer], duration_days: [80, 100], host_groups: [dry_root_rot]}
  - {id: castor, name: Castor, family: Euphorbiaceae, group: oilseed, seasons: [kharif], duration_days: [150, 180], host_groups: []}
  - {id: cotton, name: Cotton, family: Malvaceae, group: fibre, seasons: [kharif], duration_days: [150, 180], host_groups: [pod_borer, pink_bollworm, whitefly_viruses, root_knot_nematode]}
  - {id: tomato, name: Tomato, family: Solanaceae, group: vegetable, seasons: [kharif, rabi, summer], duration_days: [100, 140], host_groups: [pod_borer, whitefly_viruses, root_knot_nematode, bacterial_wilt, collar_rot]}
  - {id: brinjal, name: Brinjal (eggplant), family: Solanaceae, group: vegetable, seasons: [kharif, rabi], duration_days: [120, 160], host_groups: [root_knot_nematode, bacterial_wilt]}
  - {id: chilli, name: Chilli, family: Solanaceae, group: vegetable, seasons: [kharif, rabi], duration_days: [150, 200], host_groups: [whitefly_viruses, thrips, collar_rot, bacterial_wilt]}
  - {id: potato, name: Potato, family: Solanaceae, group: vegetable, seasons: [rabi], duration_days: [90, 120], host_groups: [bacterial_wilt, root_knot_nematode]}
  - {id: okra, name: Okra (bhindi), family: Malvaceae, group: vegetable, seasons: [kharif, summer], duration_days: [90, 110], host_groups: [whitefly_viruses, root_knot_nematode]}
  - {id: onion, name: Onion, family: Amaryllidaceae, group: vegetable, seasons: [rabi, kharif], duration_days: [110, 150], host_groups: [thrips]}
  - {id: cabbage_cauliflower, name: Cabbage / cauliflower, family: Brassicaceae, group: vegetable, seasons: [rabi], duration_days: [90, 120], host_groups: [diamondback_moth]}
  - {id: bottle_gourd, name: Bottle gourd, family: Cucurbitaceae, group: vegetable, seasons: [kharif, summer], duration_days: [90, 120], host_groups: [fruit_fly, root_knot_nematode]}
  - {id: sunn_hemp, name: Sunn hemp (green manure), family: Fabaceae, group: green_manure, seasons: [kharif, summer], duration_days: [45, 60], host_groups: []}
  - {id: other, name: Other crop, family: null, group: other, seasons: [kharif, rabi, summer, other], duration_days: [30, 365], host_groups: []}
  - {id: fallow, name: Fallow (no crop), family: null, group: other, seasons: [kharif, rabi, summer, other], duration_days: [30, 365], host_groups: []}

groups:
  cereal: Cereals & millets
  pulse: Pulses
  oilseed: Oilseeds
  fibre: Fibre
  vegetable: Vegetables & spices
  green_manure: Green manure
  other: Other

problems:
  drought: {name: Drought or long dry spell}
  excess_rain: {name: Waterlogging or heavy rain}
  heat: {name: Heat stress}
  pod_borer: {name: Pod borer / bollworm, host_groups: [pod_borer]}
  leaf_curl_mosaic: {name: Leaf curl / yellow mosaic, host_groups: [whitefly_viruses]}
  wilt: {name: Wilt, host_groups: [bacterial_wilt]}
  root_rot: {name: Root or collar rot, host_groups: [dry_root_rot, collar_rot]}
  nematodes: {name: Root knots (nematodes), host_groups: [root_knot_nematode]}
  leaf_disease: {name: Leaf spots or blight}
  weeds: {name: Heavy weeds}
  other_pests: {name: Other pests}
  poor_germination: {name: Poor germination}

residue:
  removed: Removed from field
  burned: Burned
  incorporated: Ploughed in
  mulched: Left on surface (mulch)
  grazed: Grazed by animals

# Regional agronomy (pilot: Telangana / Deccan plateau).
# sowing  Sowing (or transplanting) window per season, month-day.
# ym      Attainable yield with good management, kg/ha (fresh weight for vegetables). Indicative values,
#         to be validated against district statistics (DES) and state packages of practice.
# n_rec   Typical recommended fertiliser nitrogen, kg N/ha (state packages of practice; indicative).
# price   Rs/kg of product: minimum support price, kharif 2025-26 and rabi marketing season 2026-27 (CACP);
#         crops without an MSP (castor, vegetables) use indicative farm-gate prices. Update every season.
# cost    Indicative paid-out cost of cultivation, Rs/ha, excluding nitrogen fertiliser (priced separately).
agronomy:
  rice: {ym: 6000, n_rec: 120, price: 23.69, cost: 65000, product: paddy, sowing: {kharif: ["06-20", "08-15"], rabi: ["12-01", "01-31"]}}
